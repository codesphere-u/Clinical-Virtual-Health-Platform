name: Release & Container Registry Publication

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Docker image tag (e.g., v1.0.0 or latest)'
        required: true
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  publish-containers:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - dockerfile: services/api/Dockerfile
            image_name: docaas-api
          - dockerfile: apps/patient-web/Dockerfile
            image_name: docaas-patient-web
          - dockerfile: apps/clinician-web/Dockerfile
            image_name: docaas-clinician-web
          - dockerfile: apps/admin-web/Dockerfile
            image_name: docaas-admin-web
          - dockerfile: apps/analytics-web/Dockerfile
            image_name: docaas-analytics-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.version_tag || 'latest' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
