name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @docaas/database run db:generate

      - name: Build Workspace
        run: pnpm run build

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

  test:
    name: Automated Test Suite & Postgres Migrations
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aura_user
          POSTGRES_PASSWORD: aura_test_password
          POSTGRES_DB: aura_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply & Verify PostgreSQL SQL Migrations
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools >/dev/null
          redis-cli -h localhost -p 6379 ping | grep -q PONG
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/src/migrations/0001_initial_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/src/migrations/0002_audit_indexes.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) AS table_count FROM information_schema.tables WHERE table_schema = 'public';"
        env:
          DATABASE_URL: postgresql://aura_user:aura_test_password@localhost:5432/aura_health_test

      - name: Execute Test Suite
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://aura_user:aura_test_password@localhost:5432/aura_health_test
          REDIS_URL: redis://localhost:6379

  docker-build-check:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    strategy:
      fail-fast: false
      matrix:
        service:
          - context: .
            dockerfile: services/api/Dockerfile
            name: docaas-api
          - context: .
            dockerfile: apps/patient-web/Dockerfile
            name: docaas-patient-web
          - context: .
            dockerfile: apps/clinician-web/Dockerfile
            name: docaas-clinician-web
          - context: .
            dockerfile: apps/admin-web/Dockerfile
            name: docaas-admin-web
          - context: .
            dockerfile: apps/analytics-web/Dockerfile
            name: docaas-analytics-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and verify Docker image (${{ matrix.service.name }})
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml config -q
          docker build -f "${{ matrix.service.dockerfile }}" -t "${{ matrix.service.name }}:ci" "${{ matrix.service.context }}"
          docker run --rm "${{ matrix.service.name }}:ci" node -e "if (process.getuid && process.getuid() === 0) process.exit(1)"
