version: '3.8'

networks:
  aura_network:
    driver: bridge
    name: aura_clinical_network

services:
  # ── Infrastructure Services ────────────────────────────────────────────────

  # PostgreSQL 16 Relational Database + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinical_platform}
      POSTGRES_USER: ${POSTGRES_USER:-aura_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_secure_password_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aura_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aura_admin} -d ${POSTGRES_DB:-clinical_platform}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 7 — Rate Limiting, Caching & Realtime PubSub
  redis:
    image: redis:7.2-alpine
    container_name: aura_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - aura_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO Encrypted Medical Document & Imaging Vault (S3-Compatible)
  minio:
    image: minio/minio:latest
    container_name: aura_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minio_aura_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio_aura_secret_dev}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - aura_network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  # LiveKit WebRTC SFU — Nigeria (Lagos) + UK (London) Clusters
  livekit:
    image: livekit/livekit-server:latest
    container_name: aura_livekit
    restart: unless-stopped
    command: --dev --keys '${LIVEKIT_API_KEY:-devkey}:${LIVEKIT_API_SECRET:-devkey_secret_minimum_32_chars_____}'
    ports:
      - '7880:7880'
      - '7881:7881'
      - '7882:7882/udp'
    networks:
      - aura_network

  # ── Database Migration Runner (runs once, then exits) ─────────────────────
  db-migrate:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: builder
    container_name: aura_db_migrate
    command: node -e "require('./packages/database/dist/migrate.js')"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://aura_admin:aura_secure_password_dev@aura_postgres:5432/clinical_platform}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aura_network
    restart: 'no'

  # ── Application Services ───────────────────────────────────────────────────

  # Aura Clinical API (Fastify)
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    container_name: aura_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://aura_admin:aura_secure_password_dev@aura_postgres:5432/clinical_platform}
      REDIS_URL: ${REDIS_URL:-redis://aura_redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_min_64}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_in_production_min_64}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://aura_livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devkey_secret_minimum_32_chars_____}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-aura_minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio_aura_admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio_aura_secret_dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3002,http://localhost:3003,http://localhost:3004}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - aura_network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health/ready']
      interval: 10s
      timeout: 5s
      retries: 10

  # Patient Web Portal (Next.js 15 — Port 3000)
  patient-web:
    build:
      context: ../..
      dockerfile: apps/patient-web/Dockerfile
    container_name: aura_patient_web
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aura_network

  # Clinician Workstation (Next.js 15 — Port 3002)
  clinician-web:
    build:
      context: ../..
      dockerfile: apps/clinician-web/Dockerfile
    container_name: aura_clinician_web
    restart: unless-stopped
    environment:
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
    ports:
      - '3002:3002'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aura_network

  # Admin Command Center (Next.js 15 — Port 3003)
  admin-web:
    build:
      context: ../..
      dockerfile: apps/admin-web/Dockerfile
    container_name: aura_admin_web
    restart: unless-stopped
    environment:
      PORT: 3003
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '3003:3003'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aura_network

  # Clinical Analytics Dashboard (Next.js 15 — Port 3004)
  analytics-web:
    build:
      context: ../..
      dockerfile: apps/analytics-web/Dockerfile
    container_name: aura_analytics_web
    restart: unless-stopped
    environment:
      PORT: 3004
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - '3004:3004'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aura_network

volumes:
  postgres_data:
    name: aura_postgres_data
  redis_data:
    name: aura_redis_data
  minio_data:
    name: aura_minio_data
